<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — RestoraCare</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=1">
    <script>(function(){try{if(localStorage.getItem('rc-dark')==='1'){document.documentElement.classList.add('dark')}if(localStorage.getItem('rc-rtl')==='1'){document.documentElement.setAttribute('dir','rtl')}}catch(e){}})();</script>
</head>
<body class="auth-page">

    <!-- Top Bar with Back to Home & Controls -->
    <header class="auth-topbar">
        <a href="index.html" class="auth-back-link" aria-label="Return to RestoraCare Homepage">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Home</span>
        </a>
        <div class="auth-toggles">
            <!-- RTL Toggle -->
            <button onclick="toggleDir()" class="nav-icon-btn auth-toggle-btn" id="rtlToggleAuth" title="Toggle RTL" aria-label="Toggle layout direction / RTL">
                <span class="dir-indicator dir-label" style="font-size:0.6875rem;font-weight: 600;">RTL</span>
            </button>
            <!-- Theme Toggle -->
            <button onclick="toggleTheme()" class="nav-icon-btn auth-toggle-btn auth-dark-toggle" id="darkToggleAuth" title="Toggle dark mode" aria-label="Toggle dark mode">
                <span class="theme-icon-wrap"><i class="fas fa-moon"></i></span>
            </button>
        </div>
    </header>

    <!-- Main Auth Container -->
    <main class="auth-main" style="width:100%;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;padding:1.5rem 0;">
        <div class="auth-card">
            <!-- Ambient Glow Shapes -->
            <div style="position:absolute;top:-50px;right:-50px;width:150px;height:150px;background:radial-gradient(circle, rgba(14,124,107,0.18) 0%, rgba(14,124,107,0) 70%);border-radius:50%;pointer-events:none;filter:blur(24px);"></div>
            <div style="position:absolute;bottom:-40px;left:-40px;width:140px;height:140px;background:radial-gradient(circle, rgba(212,168,83,0.14) 0%, rgba(212,168,83,0) 70%);border-radius:50%;pointer-events:none;filter:blur(24px);"></div>

            <!-- Card Header -->
            <div class="auth-header">
                <a href="index.html" class="nav-logo auth-logo" aria-label="RestoraCare Home" style="justify-content:center;margin-bottom:1.25rem;">
                    <div id="logo-container" style="display:inline-flex;align-items:center;justify-content:center;">
                        <svg width="38" height="38" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                          <defs><linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0E7C6B"/><stop offset="100%" stop-color="#0A5C50"/></linearGradient></defs>
                          <rect width="100" height="100" rx="20" fill="url(#logoBg)"/>
                          <path d="M50 20 C50 20 30 30 30 50 C30 65 40 78 50 80 C60 78 70 65 70 50 C70 30 50 20 50 20Z" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                          <path d="M50 35 L50 65" stroke="#B8E8D8" stroke-width="3" stroke-linecap="round"/>
                          <path d="M38 50 L62 50" stroke="#B8E8D8" stroke-width="3" stroke-linecap="round"/>
                          <circle cx="50" cy="50" r="5" fill="white" opacity="0.9"/>
                        </svg>
                    </div>
                    <div class="nav-logo-text" style="text-align:left;">
                        <span class="brand-top">Physiotherapy</span>
                        <span class="brand-bottom">RestoraCare</span>
                    </div>
                </a>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your patient portal</p>
            </div>

            <!-- Sign In Form -->
            <form class="auth-form" onsubmit="event.preventDefault(); alert('Sign in successful! Redirecting to your patient dashboard...'); window.location.href='dashboard.html';" id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-input" placeholder="name@example.com" autocomplete="email" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('login-password', this)" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-options">
                    <label class="remember-me form-check" for="remember-me">
                        <input type="checkbox" id="remember-me" class="form-checkbox">
                        <span>Remember Me</span>
                    </label>
                    <a href="javascript:void(0)" onclick="alert('A password reset link has been dispatched to your email address.');" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary w-full" style="width:100%;padding:0.875rem 1.25rem;font-size:1rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:0.5rem;cursor:pointer;">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right" style="font-size:0.875rem;"></i>
                </button>
            </form>

            <!-- Social Login Divider -->
            <div class="auth-divider">— or sign in with —</div>

            <!-- Social Login Buttons -->
            <div class="social-auth-grid">
                <button type="button" class="btn-oauth google-svg" onclick="alert('Connecting to Google patient authentication...');" title="Sign in with Google" aria-label="Sign in with Google">
                    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.9 33.5 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.2-2.7-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.5 18.8 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.8-3.5-11.3-8.3l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.2-2.7-.4-3.9z"/></svg>
                </button>
                <button type="button" class="btn-oauth apple-svg" onclick="alert('Connecting to Apple ID authentication...');" title="Sign in with Apple" aria-label="Sign in with Apple">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.32 2.32-1.96 4.41-3.74 4.25z"/></svg>
                </button>
                <button type="button" class="btn-oauth facebook-svg" onclick="alert('Connecting to Facebook authentication...');" title="Sign in with Facebook" aria-label="Sign in with Facebook">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07c0 6.02 4.39 11.02 10.13 11.93v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.69.24 2.69.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8v8.44C19.61 23.09 24 18.09 24 12.07z"/></svg>
                </button>
            </div>

            <!-- Card Footer -->
            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>
        </div>
    </main>

    <script src="components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initAuthPage === 'function') {
                initAuthPage();
            }
            if (typeof LOGO_SVG !== 'undefined') {
                const logoEl = document.getElementById('logo-container');
                if (logoEl) logoEl.innerHTML = LOGO_SVG;
            }
            if (typeof GOOGLE_SVG !== 'undefined') {
                document.querySelectorAll('.google-svg').forEach(el => el.innerHTML = GOOGLE_SVG);
            }
            if (typeof APPLE_SVG !== 'undefined') {
                document.querySelectorAll('.apple-svg').forEach(el => el.innerHTML = APPLE_SVG);
            }
            if (typeof FACEBOOK_SVG !== 'undefined') {
                document.querySelectorAll('.facebook-svg').forEach(el => el.innerHTML = FACEBOOK_SVG);
            }
        });
    </script>
</body>
</html>
