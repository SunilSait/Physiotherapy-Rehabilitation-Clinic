<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found. The rehabilitation program or page you're looking for doesn't exist or has been moved.">
    <title>404 — Page Not Found | RestoraCare — Physiotherapy &amp; Rehabilitation Clinic</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=17">
    <script>(function(){try{if(localStorage.getItem('rc-dark')==='1'){document.documentElement.classList.add('dark')}if(localStorage.getItem('rc-rtl')==='1'){document.documentElement.setAttribute('dir','rtl')}}catch(e){}})();</script>
</head>
<body class="fullscreen-page">

<!-- Background Ambient Layer -->
<div class="fullscreen-bg-layer" aria-hidden="true">
    <div class="fullscreen-bg-grid"></div>
    <div class="bg-glow-orb-1"></div>
    <div class="bg-glow-orb-2"></div>
    <div class="bg-glow-orb-center"></div>
</div>

<!-- Top Bar -->
<header class="fullscreen-topbar">
    <a href="index.html" class="nav-logo" aria-label="RestoraCare Home" style="display:flex;align-items:center;gap:0.75rem;text-decoration:none;">
        <div id="logo-container" style="display:inline-flex;align-items:center;justify-content:center;">
            <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs><linearGradient id="logoBg404" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0E7C6B"/><stop offset="100%" stop-color="#0A5C50"/></linearGradient></defs>
                <rect width="100" height="100" rx="20" fill="url(#logoBg404)"/>
                <path d="M50 20 C50 20 30 30 30 50 C30 65 40 78 50 80 C60 78 70 65 70 50 C70 30 50 20 50 20Z" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M50 35 L50 65" stroke="#B8E8D8" stroke-width="3" stroke-linecap="round"/>
                <path d="M38 50 L62 50" stroke="#B8E8D8" stroke-width="3" stroke-linecap="round"/>
                <circle cx="50" cy="50" r="5" fill="white" opacity="0.9"/>
            </svg>
        </div>
        <div class="nav-logo-text">
            <span class="brand-top" style="display:block;font-size:0.6875rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);line-height:1;">Physiotherapy</span>
            <span class="brand-bottom" style="display:block;font-size:1.15rem;font-weight:700;color:var(--heading);letter-spacing:-0.02em;line-height:1.2;">RestoraCare</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;align-items:center;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction" aria-label="Toggle layout direction / RTL">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <span class="theme-icon-wrap"><i class="fas fa-moon"></i></span>
        </button>
    </div>
</header>

<!-- Content -->
<main class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
        <div class="error-illustration">
            <div class="error-code">404</div>
        </div>
        <h1 class="error-subtitle">Page Not Found</h1>
        <p class="error-desc">The therapy session, clinical service, or resource you are looking for has been moved, renamed, or is temporarily unavailable.</p>
        <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
            <a href="index.html" class="btn btn-primary btn-lg" style="display:inline-flex;align-items:center;gap:0.5rem;">
                <i class="fas fa-home" aria-hidden="true"></i>
                <span>Back to Home</span>
            </a>
            <a href="contact.html" class="btn btn-secondary btn-lg" style="display:inline-flex;align-items:center;gap:0.5rem;">
                <i class="fas fa-headset" aria-hidden="true"></i>
                <span>Contact Support</span>
            </a>
        </div>
    </div>
</main>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof initAuthPage === 'function') initAuthPage();
        if (typeof LOGO_SVG !== 'undefined') {
            const logoEl = document.getElementById('logo-container');
            if (logoEl) logoEl.innerHTML = LOGO_SVG;
        }
    });
</script>
</body>
</html>
