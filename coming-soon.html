<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This RestoraCare digital health feature is launching soon. Subscribe for early clinical access and opening updates.">
    <title>Coming Soon | RestoraCare — Physiotherapy &amp; Rehabilitation Clinic</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=51">
    <script>(function(){try{if(localStorage.getItem('rc-dark')==='1'){document.documentElement.classList.add('dark')}if(localStorage.getItem('rc-rtl')==='1'){document.documentElement.setAttribute('dir','rtl')}}catch(e){}})();</script>
</head>
<body class="fullscreen-page">

<!-- Background Ambient Layer -->
<div class="fullscreen-bg-layer" aria-hidden="true">
    <div class="fullscreen-bg-grid"></div>
    <div class="bg-glow-orb-1"></div>
    <div class="bg-glow-orb-2"></div>
    <div class="bg-glow-orb-center"></div>

    <!-- Telemetry Vital Pulse Wave -->
    <div class="coming-vital-pulse">
        <svg viewBox="0 0 1200 120" preserveAspectRatio="none" style="width:100%;height:100%;">
            <path class="vital-path" d="M0,60 L360,60 L390,25 L415,95 L440,15 L465,85 L490,60 L1200,60" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </div>

    <!-- Floating Ambient Particles -->
    <div class="floating-particle" style="top:22%;left:12%;font-size:1.15rem;animation-delay:0s;"><i class="fas fa-plus"></i></div>
    <div class="floating-particle" style="top:28%;right:14%;font-size:0.95rem;animation-delay:2s;color:var(--secondary);"><i class="fas fa-sparkle"></i></div>
    <div class="floating-particle" style="bottom:24%;left:16%;font-size:1.2rem;animation-delay:4s;color:var(--secondary);"><i class="fas fa-sparkles"></i></div>
    <div class="floating-particle" style="bottom:20%;right:15%;font-size:1.05rem;animation-delay:1.5s;"><i class="fas fa-plus"></i></div>
</div>

<!-- Top Bar -->
<header class="fullscreen-topbar">
    <a href="index.html" class="nav-logo" aria-label="RestoraCare Home" style="display:flex;align-items:center;gap:0.75rem;text-decoration:none;">
        <div id="logo-container" style="display:inline-flex;align-items:center;justify-content:center;">
            <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs><linearGradient id="logoBgCS" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0E7C6B"/><stop offset="100%" stop-color="#0A5C50"/></linearGradient></defs>
                <rect width="100" height="100" rx="20" fill="url(#logoBgCS)"/>
                <path d="M50 20 C50 20 30 30 30 50 C30 65 40 78 50 80 C60 78 70 65 70 50 C70 30 50 20 50 20Z" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M50 35 L50 65" stroke="#B8E8D8" stroke-width="3" stroke-linecap="round"/>
                <path d="M38 50 L62 50" stroke="#B8E8D8" stroke-width="3" stroke-linecap="round"/>
                <circle cx="50" cy="50" r="5" fill="white" opacity="0.9"/>
            </svg>
        </div>
        <div class="nav-logo-text">
            <span class="brand-top">Physiotherapy</span>
            <span class="brand-bottom">RestoraCare</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;align-items:center;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction" aria-label="Toggle layout direction / RTL">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <span class="theme-icon-wrap"><i class="fas fa-moon"></i></span>
        </button>
    </div>
</header>

<!-- Content -->
<main class="fullscreen-content">
    <div style="max-width:540px;width:100%;margin:0 auto;text-align:center;">
        <span class="badge badge-primary" style="margin-bottom:1rem;display:inline-flex;align-items:center;gap:0.35rem;padding:0.35rem 0.85rem;border-radius:9999px;font-size:0.8125rem;font-weight:600;background:rgba(14,124,107,0.12);color:var(--primary);border:1px solid rgba(14,124,107,0.25);">
            <i class="fas fa-clock" aria-hidden="true"></i> Under Construction
        </span>
        <h1 class="coming-title">Coming Soon</h1>
        <p class="coming-desc">
            We are engineering an advanced digital recovery and telemetry suite for our patients. This module will launch soon. Subscribe below to receive early priority access.
        </p>

        <!-- Countdown -->
        <div class="countdown-grid" id="countdown">
            <div class="countdown-item">
                <div class="countdown-value" id="cd-days">28</div>
                <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="cd-hours">14</div>
                <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="cd-mins">36</div>
                <div class="countdown-label">Minutes</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="cd-secs">52</div>
                <div class="countdown-label">Seconds</div>
            </div>
        </div>

        <!-- Subscribe -->
        <form class="subscribe-form" onsubmit="event.preventDefault(); alert('Subscribed! We will notify you when this clinical module launches.'); this.reset();">
            <input type="email" placeholder="Enter your email address..." required aria-label="Email address for launch notification">
            <button type="submit" class="btn btn-primary" style="white-space:nowrap;display:inline-flex;align-items:center;gap:0.4rem;">
                <i class="fas fa-bell" aria-hidden="true"></i>
                <span>Notify Me</span>
            </button>
        </form>

        <!-- Social -->
        <div class="coming-socials">
            <a href="https://facebook.com" class="coming-social-link" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><i class="fab fa-facebook-f" aria-hidden="true"></i></a>
            <a href="https://instagram.com" class="coming-social-link" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="fab fa-instagram" aria-hidden="true"></i></a>
            <a href="https://linkedin.com" class="coming-social-link" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fab fa-linkedin-in" aria-hidden="true"></i></a>
            <a href="https://twitter.com" class="coming-social-link" target="_blank" rel="noopener noreferrer" aria-label="Twitter / X"><i class="fab fa-x-twitter" aria-hidden="true"></i></a>
        </div>
    </div>
</main>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof initAuthPage === 'function') initAuthPage();
        if (typeof LOGO_SVG !== 'undefined') {
            const logoEl = document.getElementById('logo-container');
            if (logoEl) logoEl.innerHTML = LOGO_SVG;
        }

        // Live countdown timer (30 days from now)
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 30);
        targetDate.setHours(targetDate.getHours() + 14);
        targetDate.setMinutes(targetDate.getMinutes() + 25);

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;
            if (diff <= 0) return;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            const dEl = document.getElementById('cd-days');
            const hEl = document.getElementById('cd-hours');
            const mEl = document.getElementById('cd-mins');
            const sEl = document.getElementById('cd-secs');

            if (dEl) dEl.textContent = String(days).padStart(2, '0');
            if (hEl) hEl.textContent = String(hours).padStart(2, '0');
            if (mEl) mEl.textContent = String(mins).padStart(2, '0');
            if (sEl) sEl.textContent = String(secs).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    });
</script>
</body>
</html>
